[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlbisect"
version = "0.1.0"
description = "Find the changes that caused a noisy ML regression."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Wissem Fouda" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "rich>=13.8,<16",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "types-PyYAML>=6.0,<7",
]
lab = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
]

[project.scripts]
mlbisect = "mlbisect.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
